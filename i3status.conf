### I3 STATUS CONFIG BY diws ####


### General Settings 
general {
        colors = false
        interval = 2
        color_good = "#919753"
        color_degraded = "#EBCB8B"
        color_bad = "#A35151"
        markup = pango
}

### Widget List 
order += "cpu_usage"
order += "cpu_temperature 0"
order += "disk /"
order += "wireless _first_"
order += "volume master"
order += "battery all"
order += "tztime local"

### Widget Settings
cpu_usage {
  format = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'> CPU   %usage </span><span foreground='#212121' background='#FFFFFF'></span>"
}

cpu_temperature 0 {
        format = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'> CPU  %degrees °C </span><span foreground='#212121' background='#FFFFFF'></span>"
        path = "/sys/devices/platform/coretemp.0/hwmon/hwmon5/temp1_input"
}

disk "/" {
        format = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'> %avail </span><span foreground='#212121' background='#FFFFFF'></span>"
}

wireless _first_ {
        format_up = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'>  %quality at %essid </span><span foreground='#212121' background='#FFFFFF'></span>"
        format_down = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'> down </span><span foreground='#212121' background='#FFFFFF'></span>"
}

volume master {
        format = "<span foreground='#FFFFFF'></span><span background='#FFFFFF'> %volume </span><span foreground='#212121' background='#FFFFFF'></span>"
        format_muted = "<span foreground='#FFFFFF'></span><span background='#98971a'> muted </span><span foreground='#212121' background='#FFFFFF'></span>"
        device = "pulse:alsa_output.pci-0000_00_1b.0.analog-stereo"
}

battery all {
        format = "<span foreground='#FFFFFF'></span><span foreground='#000000' background='#FFFFFF'> %status %percentage </span><span foreground='#282828' background='#FFFFFF'></span>"
        status_chr = ""
        status_bat = ""
        status_full = ""
}

tztime local {
        format = "<span foreground='#FFFFFF'></span><span foreground='#000000' background='#FFFFFF'> %a, %d %b %R </span><span foreground='#212121' background='#FFFFFF'></span>"
}
